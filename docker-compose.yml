services:
  web:
    image: nginx:alpine
    ports: ["8080:80"]
    volumes:
      - ./public:/var/www/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [php]

  php:
    build: ./docker/php
    volumes:
      - ./:/var/www
    environment:
      - APP_ENV=${APP_ENV:-local}
    depends_on: [mysql]

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-mesa_digital}
      MYSQL_USER: ${DB_USERNAME:-mesa_digital}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me}
      MYSQL_ROOT_PASSWORD: root_change_me
    volumes:
      - mysql_data:/var/lib/mysql
    ports: ["3306:3306"]

  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]

  scheduler:
    build: ./docker/php
    volumes: ["./:/var/www"]
    command: ["sh", "-c", "while true; do php bin/console.php schedule:run; sleep 60; done"]
    depends_on: [mysql, mailpit]

  adminer:
    image: adminer
    ports: ["8081:8080"]
    depends_on: [mysql]

volumes:
  mysql_data:
